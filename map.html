<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f4f3ec">
  <title>地點連線地圖 | GRAPH / 09</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #202a26;
      --muted: #727c75;
      --paper: #f4f3ec;
      --white: #fffefa;
      --line: #dcded4;
      --green: #26735c;
      --green-dark: #1e5d4a;
      --green-pale: #e6f0e9;
      --gold: #d3a443;
      --shadow: 0 12px 36px #243c300d;
      font-family: "Aptos", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      color: var(--ink);
      background: radial-gradient(ellipse at 93% 0%, #e1eadf 0, transparent 31%), var(--paper);
    }

    a { color: inherit; }

    .shell { width: min(1080px, calc(100% - 40px)); margin: 0 auto; padding: 26px 0 42px; }
    .topline { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
    .brand { display: flex; align-items: center; gap: 10px; font-size: .78rem; font-weight: 850; letter-spacing: .08em; }
    .brand-mark { display: grid; place-items: center; width: 34px; aspect-ratio: 1; border-radius: 9px; color: white; background: var(--green); font: 850 .72rem/1 "Cascadia Code", Consolas, monospace; }
    .back-link { color: var(--green-dark); font-size: .78rem; font-weight: 750; text-decoration-thickness: 1px; text-underline-offset: 3px; }
    header { display: flex; justify-content: space-between; align-items: end; gap: 20px; padding: 30px 0 22px; }
    .kicker { margin: 0 0 7px; color: var(--green); font-size: .7rem; font-weight: 850; letter-spacing: .12em; }
    h1 { margin: 0; font-size: clamp(1.8rem, 4vw, 2.65rem); line-height: 1.16; }
    .subtitle { margin: 9px 0 0; color: var(--muted); font-size: .9rem; line-height: 1.7; }
    .stats { display: flex; gap: 9px; flex: 0 0 auto; }
    .stat { min-width: 94px; padding: 11px 14px; border: 1px solid var(--line); border-radius: 7px; background: #fffefaad; text-align: center; }
    .stat strong { display: block; color: var(--green-dark); font: 800 1.35rem/1.2 "Cascadia Code", Consolas, monospace; }
    .stat span { color: var(--muted); font-size: .68rem; }
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) 255px; gap: 14px; align-items: start; }
    .panel { min-width: 0; overflow: hidden; border: 1px solid var(--line); border-radius: 8px; background: var(--white); box-shadow: var(--shadow); }
    .panel-heading { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 15px 17px; border-bottom: 1px solid var(--line); }
    .panel-heading h2 { margin: 0; font-size: .92rem; }
    .panel-meta { color: var(--muted); font: 700 .68rem "Cascadia Code", Consolas, monospace; letter-spacing: .05em; }
    .map-wrap { padding: 14px; }
    .map { display: block; width: 100%; height: auto; }
    .road { stroke: #aab8aa; stroke-width: 4; stroke-linecap: round; }
    .road-label { fill: var(--muted); font: 700 13px "Cascadia Code", Consolas, monospace; paint-order: stroke; stroke: var(--white); stroke-width: 5px; stroke-linejoin: round; text-anchor: middle; }
    .place circle { fill: var(--green-pale); stroke: var(--green); stroke-width: 3; }
    .place text { fill: var(--green-dark); font: 800 21px "Cascadia Code", Consolas, monospace; text-anchor: middle; dominant-baseline: central; }
    .place.start circle, .place.end circle { fill: var(--green); }
    .place.start text, .place.end text { fill: white; }
    .legend { display: flex; flex-wrap: wrap; gap: 15px; padding: 0 18px 16px; color: var(--muted); font-size: .72rem; }
    .legend-item { display: inline-flex; align-items: center; gap: 7px; }
    .legend-dot { width: 11px; height: 11px; border: 2px solid var(--green); border-radius: 50%; background: var(--green-pale); }
    .legend-dot.special { border-color: var(--green); background: var(--green); }
    .road-list { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 7px; padding: 14px; }
    .road-item { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 9px 10px; border: 1px solid #e8e9e1; border-radius: 5px; background: #fffefa; }
    .road-item span { color: var(--muted); font-size: .68rem; }
    .road-item strong { color: var(--green-dark); font: 750 .77rem "Cascadia Code", Consolas, monospace; white-space: nowrap; }
    .note { margin: 0; padding: 0 16px 15px; color: var(--muted); font-size: .72rem; line-height: 1.6; }

    @media (max-width: 760px) {
      .layout { grid-template-columns: 1fr; }
      .road-list { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }

    @media (max-width: 520px) {
      .shell { width: calc(100% - 22px); padding-top: 17px; }
      .topline { align-items: flex-start; }
      .brand { font-size: .68rem; }
      .back-link { max-width: 125px; text-align: right; }
      header { align-items: flex-start; flex-direction: column; gap: 15px; padding: 23px 0 17px; }
      .stats { width: 100%; }
      .stat { flex: 1; }
      .map-wrap { padding: 5px; }
      .road-label { font-size: 15px; }
      .road-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
  <main class="shell">
    <div class="topline">
      <div class="brand"><span class="brand-mark">G09</span><span>GRAPH / 09 ROADS</span></div>
      <a class="back-link" href="index.html">返回最大堆積首頁</a>
    </div>

    <header>
      <div>
        <p class="kicker">LOCATION NETWORK</p>
        <h1>六個地點，九條道路。</h1>
        <p class="subtitle">地圖呈現 A、B、C、D、E、F 六個地點，以及指定的九條雙向道路。</p>
      </div>
      <div class="stats" aria-label="地圖統計">
        <div class="stat"><strong>06</strong><span>地點</span></div>
        <div class="stat"><strong>09</strong><span>道路</span></div>
      </div>
    </header>

    <div class="layout">
      <section class="panel" aria-labelledby="mapHeading">
        <div class="panel-heading">
          <h2 id="mapHeading">地點連線圖</h2>
          <span class="panel-meta">A — F</span>
        </div>
        <div class="map-wrap">
          <svg class="map" viewBox="0 0 900 560" role="img" aria-labelledby="mapTitle mapDescription">
            <title id="mapTitle">A 到 F 六個地點與九條道路的地圖</title>
            <desc id="mapDescription">道路為 A 到 B、A 到 C、B 到 C、C 到 D、C 到 E、D 到 E、E 到 F、D 到 F、B 到 D。</desc>
            <g class="roads" fill="none" aria-hidden="true">
              <line class="road" x1="120" y1="280" x2="300" y2="145" />
              <line class="road" x1="120" y1="280" x2="300" y2="415" />
              <line class="road" x1="300" y1="145" x2="300" y2="415" />
              <line class="road" x1="300" y1="415" x2="580" y2="145" />
              <line class="road" x1="300" y1="415" x2="580" y2="415" />
              <line class="road" x1="580" y1="145" x2="580" y2="415" />
              <line class="road" x1="580" y1="415" x2="790" y2="280" />
              <line class="road" x1="580" y1="145" x2="790" y2="280" />
              <line class="road" x1="300" y1="145" x2="580" y2="145" />
            </g>
            <g aria-hidden="true">
              <text class="road-label" x="205" y="195">A—B</text>
              <text class="road-label" x="205" y="365">A—C</text>
              <text class="road-label" x="332" y="280">B—C</text>
              <text class="road-label" x="420" y="300">C—D</text>
              <text class="road-label" x="440" y="400">C—E</text>
              <text class="road-label" x="612" y="280">D—E</text>
              <text class="road-label" x="690" y="370">E—F</text>
              <text class="road-label" x="690" y="205">D—F</text>
              <text class="road-label" x="440" y="130">B—D</text>
            </g>
            <g class="place start" transform="translate(120 280)">
              <circle r="31" /><text y="1">A</text>
            </g>
            <g class="place" transform="translate(300 145)">
              <circle r="31" /><text y="1">B</text>
            </g>
            <g class="place" transform="translate(300 415)">
              <circle r="31" /><text y="1">C</text>
            </g>
            <g class="place" transform="translate(580 145)">
              <circle r="31" /><text y="1">D</text>
            </g>
            <g class="place" transform="translate(580 415)">
              <circle r="31" /><text y="1">E</text>
            </g>
            <g class="place end" transform="translate(790 280)">
              <circle r="31" /><text y="1">F</text>
            </g>
          </svg>
        </div>
        <div class="legend" aria-label="圖例">
          <span class="legend-item"><i class="legend-dot special"></i>A、F 地點</span>
          <span class="legend-item"><i class="legend-dot"></i>其他地點</span>
          <span class="legend-item">線段代表雙向道路</span>
        </div>
      </section>

      <aside class="panel" aria-labelledby="roadHeading">
        <div class="panel-heading">
          <h2 id="roadHeading">道路清單</h2>
          <span class="panel-meta">09 LINKS</span>
        </div>
        <div class="road-list">
          <div class="road-item"><span>道路 01</span><strong>A — B</strong></div>
          <div class="road-item"><span>道路 02</span><strong>A — C</strong></div>
          <div class="road-item"><span>道路 03</span><strong>B — C</strong></div>
          <div class="road-item"><span>道路 04</span><strong>C — D</strong></div>
          <div class="road-item"><span>道路 05</span><strong>C — E</strong></div>
          <div class="road-item"><span>道路 06</span><strong>D — E</strong></div>
          <div class="road-item"><span>道路 07</span><strong>E — F</strong></div>
          <div class="road-item"><span>道路 08</span><strong>D — F</strong></div>
          <div class="road-item"><span>道路 09</span><strong>B — D</strong></div>
        </div>
        <p class="note">每條道路皆可雙向通行；圖中位置只用來呈現連線關係。</p>
      </aside>
    </div>
  </main>
</body>
</html>
